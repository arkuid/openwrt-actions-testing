name: Тестовый workflow

on:
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Проверка ветки проекта
      uses: actions/checkout@main

    - name: Инициализация среды компиляции
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        # ПЕРВАЯ ПРОВЕРКА: исходное состояние
        echo "=== Начальная проверка /usr/include/asm ==="
        INITIAL_ASM_LINK=$(readlink -f /usr/include/asm 2>/dev/null || echo "не существует")
        echo "Начальное значение: $INITIAL_ASM_LINK"
        
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex g++ gawk gcc-multilib gettext \
        git libncurses5-dev libssl-dev python3-dev rsync unzip zlib1g-dev swig libpython3-dev aria2 jq subversion qemu-utils ccache rename libelf-dev
        sudo -E apt-get -qq purge azure-cli ghc* zulu* hhvm llvm* firefox powershell openjdk* dotnet* google* mysql* php* android* rename speedtest-cli
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        
        # ВТОРАЯ ПРОВЕРКА: финальное состояние
        echo "=== Финальная проверка /usr/include/asm ==="
        FINAL_ASM_LINK=$(readlink -f /usr/include/asm 2>/dev/null || echo "не существует")
        echo "Финальное значение: $FINAL_ASM_LINK"
        
        # Вывод сравнения
        echo "=== Сравнение результатов ==="
        echo "До: $INITIAL_ASM_LINK"
        echo "После: $FINAL_ASM_LINK"
